<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; script-src 'self'">
  <title>XUNA AI</title>
  <!-- The bar along the top of a Mac window, behind macOS's three buttons, drawn by src/title-strip.js
       in a view of its own above the XUNA pages (see addWorkspaceTabs in src/main.js). It drags the
       window, as macOS's own title bar would; its buttons take clicks instead.

       It has two modes (macWindowLayout in src/title-bar.js). As the strip, it runs the window's width
       above the XUNA page, 40px tall (MAC_TITLE_STRIP_HEIGHT), with XUNA's logo, Back and Forward after
       the three buttons and the workspace tabs, + and Ask AI at its right end. In one row, XUNA's own
       header is the title bar and this view covers only its left end, at the header's height and in its
       colours: the three buttons, XUNA's logo, Back and Forward, the tabs and +, with XUNA's header
       carrying on from there. The logo is always XUNA's, whatever the workspace, and always before the
       tabs; XUNA's header hides its own meanwhile (src/one-row.css).
       The main process sets the height and colours; until then it lets the window's colour through.
       Its type is XUNA's Inter, from where app.xuna.ai gets it; offline, the system font stands in.

       The page declares no colour scheme. Chromium paints a page whose root is in a dark colour scheme
       with its own grey, #121212, instead of letting the window's colour show through, and the strip
       then stands out as a grey bar above XUNA's black header. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400..700;1,14..32,400..700&display=swap">
  <style>
    :root {
      --text: #0a0a0a;
      --muted: rgb(10 10 10 / 55%);
      --hover: rgb(10 10 10 / 6%);
      --selected: rgb(10 10 10 / 9%);
      --ring: rgb(10 10 10 / 35%);
      /* Ask AI is XUNA's own outline button, with the values its stylesheet computes. */
      --button-surface: #fafafa;
      --button-hover: #ffffff;
      --button-edge: #e9eaeb;
      --button-text: #181d27;
      /* The bar's height and colours, and where the controls start, as the main process sets them. */
      --bar-height: 40px;
      --bar-background: transparent;
      --bar-border: transparent;
      --lights: 90px;
    }
    :root[data-theme="dark"] {
      --text: #fafafa;
      --muted: rgb(250 250 250 / 55%);
      --hover: rgb(250 250 250 / 7%);
      --selected: rgb(250 250 250 / 13%);
      --ring: rgb(250 250 250 / 40%);
      --button-surface: #030303;
      --button-hover: #161616;
      --button-edge: #141618;
      --button-text: #f7f7f7;
    }
    html, body { margin: 0; background: transparent; }
    .strip { position: fixed; top: 0; left: 0; right: 0; height: var(--bar-height); app-region: drag; -webkit-app-region: drag; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 var(--lights); box-sizing: border-box; background: var(--bar-background); box-shadow: inset 0 -1px var(--bar-border); font: 500 13px/1 Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; -webkit-font-smoothing: antialiased; color: var(--text); user-select: none; }
    /* XUNA's logo, as XUNA's header draws it: its white wordmark, 20px tall, black on the light bar. */
    .home { display: grid; flex: none; place-items: center; height: 28px; padding: 0 8px 0 4px; border-radius: 6px; }
    .home img { display: block; height: 20px; width: auto; }
    :root:not([data-theme="dark"]) .home img { filter: invert(1); }
    .history { display: flex; flex: none; gap: 2px; margin-inline-end: auto; }
    .tabs { display: flex; gap: 2px; min-width: 0; }
    .home, .tab, .add, .ask-ai, .history button { app-region: no-drag; -webkit-app-region: no-drag; }
    .tab { display: flex; align-items: center; flex: 0 1 auto; min-width: 48px; max-width: 176px; height: 28px; border-radius: 6px; color: var(--muted); transition: transform 150ms ease; }
    .tab:hover { background: var(--hover); color: var(--text); }
    .tab.active { background: var(--selected); color: var(--text); }
    .tab.dragging { position: relative; z-index: 1; transition: none; }
    button, input { margin: 0; border: 0; background: none; color: inherit; font: inherit; }
    button { cursor: default; }
    button:focus-visible, input:focus { outline: 1px solid var(--ring); outline-offset: -1px; }
    .select { flex: 1 1 auto; min-width: 0; height: 100%; padding: 0 2px 0 10px; border-radius: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; }
    .close, .add, .history button { display: grid; place-items: center; flex: none; padding: 0; color: var(--muted); }
    .close { width: 18px; height: 18px; margin: 0 4px 0 2px; border-radius: 4px; visibility: hidden; }
    .tab:hover .close, .tab.active .close, .close:focus-visible { visibility: visible; }
    .close:hover { background: var(--hover); color: var(--text); }
    .add, .history button { width: 28px; height: 28px; border-radius: 6px; }
    .add:hover, .history button:hover:not(:disabled) { background: var(--hover); color: var(--text); }
    .history button:disabled { opacity: 0.4; }
    .rename { width: 128px; min-width: 0; height: 100%; padding: 0 10px; border-radius: 6px; user-select: text; }
    svg { display: block; }
    [hidden] { display: none !important; }

    /* One row: everything at the left end, where XUNA's header carries on, which has its own Ask AI. */
    :root[data-mode="one-row"] .history { margin-inline-end: 0; }
    :root[data-mode="one-row"] .ask-ai { display: none; }

    /* The window isn't in front: the controls fade, as macOS's own toolbars do, at once, as XUNA's header
       beside them does in one row (src/one-row.css). */
    :root[data-inactive] .strip > * { opacity: 0.5; }

    /* Something covers XUNA's page, a dialog's blurred backdrop say: in one row the bar looks covered too
       (src/preload.js reports how the cover looks), losing its bottom line as XUNA's header loses its own
       under the blur, and takes no clicks until it goes. */
    :root[data-covered] .strip { box-shadow: none; }
    :root[data-covered] .strip > * { filter: var(--cover-filter, none); pointer-events: none; }
    :root[data-covered] .strip::after { content: ''; position: absolute; inset: 0; background: var(--cover-tint, transparent); pointer-events: none; }

    /* The tabs at their full width, out of sight, for measuring the bar's left end in one row. */
    .measure { position: fixed; top: -200px; left: 0; display: flex; gap: 2px; width: max-content; visibility: hidden; pointer-events: none; font: 500 13px/1 Inter, -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

    .ask-ai { display: inline-flex; flex: none; align-items: center; gap: 6px; height: 28px; margin-left: 4px; padding: 0 10px; box-sizing: border-box; border: 1px solid var(--button-edge); border-radius: 6px; background: var(--button-surface); color: var(--button-text); box-shadow: 0 1px 2px rgb(10 13 18 / 0.05); white-space: nowrap; transition: background-color 150ms ease, opacity 150ms ease; }
    .ask-ai:hover { background: var(--button-hover); }
    .ask-ai:disabled { opacity: 0.5; }

    /* XUNA's Ask AI orb (SiriOrb in the web app, as AskAiOrb draws it): a mesh of the workspace's orb
       colours turning once every twelve seconds, a drifting sheen, a lit rim and a soft glow, breathing
       slowly. The colours are XUNA's own until the tab's page says which its workspace uses. */
    @property --angle { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
    .orb-wrap { position: relative; display: grid; flex: none; place-items: center; width: 16px; height: 16px; }
    .orb {
      --c1: #6232ff;
      --c2: #2849ff;
      --c3: color-mix(in oklab, #6232ff 62%, #2849ff);
      --c4: color-mix(in oklab, #2849ff 68%, white);
      --bg: oklch(92% 0.03 300);
      position: relative; display: grid; width: 16px; height: 16px; overflow: hidden; border-radius: 50%; isolation: isolate;
      animation: orb-breathe 5.5s ease-in-out infinite;
    }
    .orb > span { grid-area: 1 / 1; width: 100%; height: 100%; border-radius: 50%; }
    .orb-glow { position: absolute; inset: -12%; border-radius: 50%; background: radial-gradient(circle at 50% 50%, var(--glow, #2849ff) 0%, transparent 64%); filter: blur(4.5px); opacity: 0.35; }
    .orb-mesh {
      background:
        conic-gradient(from calc(var(--angle) * 2) at 25% 70%, var(--c3), transparent 20% 80%, var(--c3)),
        conic-gradient(from calc(var(--angle) * 2) at 45% 75%, var(--c2), transparent 30% 60%, var(--c2)),
        conic-gradient(from calc(var(--angle) * -3) at 80% 20%, var(--c1), transparent 40% 60%, var(--c1)),
        conic-gradient(from calc(var(--angle) * 1.5) at 60% 35%, var(--c4), transparent 25% 75%, var(--c4)),
        conic-gradient(from calc(var(--angle) * 2) at 15% 5%, var(--c2), transparent 10% 90%, var(--c2)),
        conic-gradient(from calc(var(--angle) * 1) at 20% 80%, var(--c1), transparent 10% 90%, var(--c1)),
        conic-gradient(from calc(var(--angle) * -2) at 85% 10%, var(--c3), transparent 20% 80%, var(--c3));
      box-shadow: inset var(--bg) 0 0 0.5px 0.1px;
      filter: blur(1px) contrast(1.1) saturate(1.4);
      animation: orb-turn 12s linear infinite;
    }
    .orb-sheen { background: radial-gradient(circle at 30% 24%, hsl(0 0% 100% / 0.32), transparent 34%), radial-gradient(circle at 72% 80%, hsl(0 0% 100% / 0.07), transparent 48%); mix-blend-mode: screen; animation: orb-drift 12s ease-in-out infinite alternate; }
    .orb-rim { box-shadow: inset 0 0 0 1px hsl(0 0% 100% / 0.16), inset 0 1.5px 3px hsl(0 0% 100% / 0.22), inset 0 -1.8px 3.6px hsl(0 0% 0% / 0.4); }
    @keyframes orb-turn { to { --angle: 360deg; } }
    @keyframes orb-drift { 0% { transform: translate(-6%, -4%) scale(1.05); } 100% { transform: translate(7%, 6%) scale(1.12); } }
    @keyframes orb-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.035); } }
    @media (prefers-reduced-motion: reduce) { .orb, .orb > span { animation: none; } .tab { transition: none; } }
  </style>
</head>
<body>
  <div class="strip">
    <button class="home" type="button" aria-label="Go to home" title="Home">
      <img src="xuna-logo.png" alt="XUNA" draggable="false">
    </button>
    <div class="history">
      <button class="back" type="button" aria-label="Back" disabled>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2.5 4 6l3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="forward" type="button" aria-label="Forward" disabled>
        <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="tabs" role="tablist" aria-label="Workspaces"></div>
    <button class="add" type="button" title="Open Workspace (⌘T)" aria-label="Open workspace" aria-haspopup="menu">
      <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1.5v9M1.5 6h9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    </button>
    <button class="ask-ai" type="button" aria-label="Ask AI" aria-pressed="false" disabled>
      <span class="orb-wrap" aria-hidden="true"><span class="orb-glow"></span><span class="orb"><span class="orb-mesh"></span><span class="orb-sheen"></span><span class="orb-rim"></span></span></span>
      <span>Ask AI</span>
    </button>
  </div>
  <div class="measure" aria-hidden="true"></div>
  <script src="title-strip-layout.js"></script>
  <script src="title-strip.js"></script>
</body>
</html>
