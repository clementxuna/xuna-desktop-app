<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>XUNA AI</title>
  <style>
    :root { color-scheme: light dark; --bg: #ffffff; --text: #181d27; --muted: #535862; --brand: #223ed2; }
    @media (prefers-color-scheme: dark) { :root { --bg: #010101; --text: #f7f7f7; --muted: #979797; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--text);
      font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    main { max-width: 22rem; padding: 1.5rem; text-align: center; }
    h1 { margin: 0 0 0.5rem; font-size: 1.25rem; font-weight: 600; }
    p { margin: 0 0 1.5rem; color: var(--muted); }
    button { font: inherit; font-weight: 600; color: #fff; background: var(--brand); border: 0; border-radius: 0.5rem;
      padding: 0.625rem 1.25rem; cursor: pointer; }
    button:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Can't reach XUNA AI</h1>
    <p>Check your internet connection, then try again. If you were offline, the app reconnects on its own when you're back.</p>
    <button id="retry" type="button" autofocus>Try again</button>
  </main>
  <script>
    const requested = new URLSearchParams(location.search).get('url') || '';
    const target = /^https?:\/\//.test(requested) ? requested : 'https://app.xuna.ai';
    const retry = () => { location.href = target; };
    document.getElementById('retry').addEventListener('click', retry);
    window.addEventListener('online', retry);
  </script>
</body>
</html>
