name: Release

# Builds the Windows installer and publishes it as a GitHub Release when a version tag (v1.2.3) is pushed.
# Installed copies of the app update themselves from the newest release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # The job never pushes, so the write token is not left in .git/config for install scripts to find.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Check the tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - run: npm ci

      - run: npm test

      - name: Build the installer
        run: npx electron-builder --win --publish never

      # gh keeps the release a draft until all three files are uploaded, then publishes it, so the
      # download link never points at a half-finished release. (electron-builder's own publisher
      # uploads in parallel and can split the files across duplicate releases.)
      - name: Publish the release
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --verify-tag
          --title "XUNA AI ${GITHUB_REF_NAME#v}"
          --generate-notes
          --latest
          dist/XUNA-AI-Setup.exe dist/XUNA-AI-Setup.exe.blockmap dist/latest.yml
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
